# Runs Life Dash on the server, building the image from this repository's Dockerfile.
#
# Server layout (created by the deploy workflow):
#   <DEPLOY_PATH>/life-dash.env      your settings (see .env.example); never touched by a deploy
#   <DEPLOY_PATH>/app/               the source of the deployed commit; this file is app/deploy/compose.yml
#   <DEPLOY_PATH>/app/deploy/.env    written by the deploy; points LIFE_DASH_ENV_FILE at ../../life-dash.env
#
# By hand, from <DEPLOY_PATH>/app/deploy: docker compose up -d --build | logs -f | ps
name: life-dash

services:
  life-dash:
    build:
      context: ..
      dockerfile: Dockerfile
    image: life-dash:local
    restart: unless-stopped
    env_file: ${LIFE_DASH_ENV_FILE:-life-dash.env}
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DB_PATH: /data/life-dash.db
    ports:
      # only reachable from the server itself; put a reverse proxy with HTTPS in front
      - "127.0.0.1:${LIFE_DASH_PORT:-8080}:8080"
    volumes:
      - life-dash-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  life-dash-data:
