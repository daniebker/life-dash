name: Deploy

# Copies the app to a server over SSH (rsync) and restarts it.
#
# Repository secrets:
#   SSH_PRIVATE_KEY   private key of a deploy user allowed to write DEPLOY_PATH
#   SSH_KNOWN_HOSTS   output of `ssh-keyscan -p <port> <host>`; host keys are always verified
# Repository variables (or secrets with the same names):
#   SSH_HOST, SSH_USER, DEPLOY_PATH (e.g. /srv/life-dash), SSH_PORT (optional, default 22)
#   RESTART_COMMAND   (optional) run on the server after upload, e.g. "sudo systemctl restart life-dash"
#
# The server keeps its own .env, var/ and data/ in DEPLOY_PATH; a deploy never overwrites or deletes them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER || secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
      RESTART_COMMAND: ${{ vars.RESTART_COMMAND }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SSH_HOST SSH_USER DEPLOY_PATH; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Stage app
        run: |
          mkdir -p dist
          cp -r index.html parsers.js package.json server scripts deploy dist/

      - name: Upload
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          # excluded paths are neither transferred nor deleted
          rsync -rlptz --delete --exclude '/data/' --exclude '/var/' --exclude '/.env' -e "$SSH" dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          echo "Uploaded $(git rev-parse --short HEAD) to $SSH_HOST:$DEPLOY_PATH"

      - name: Restart
        if: env.RESTART_COMMAND != ''
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes"
          $SSH "$SSH_USER@$SSH_HOST" "$RESTART_COMMAND"
