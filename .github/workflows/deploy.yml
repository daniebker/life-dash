name: Deploy

# Tests, builds a Docker image, pushes it to GitHub Container Registry (ghcr.io), then starts it
# on your server with Docker Compose over SSH.
#
# Uses the repository's "prod" environment:
#   VPS_HOST, VPS_PORT, VPS_USER   server address and SSH user (a user allowed to run docker)
#   VPS_SSH_KEY                    private SSH key for VPS_USER
#   GHCR_PAT                       token with read:packages, used by the server to pull the image
#   VPS_KNOWN_HOSTS                (optional, recommended) output of `ssh-keyscan -p <port> <host>`;
#                                  without it the host key is fetched at deploy time and trusted as-is
#   DEPLOY_PATH                    (optional variable) folder on the server, default ~/life-dash
#
# The server keeps life-dash.env and the life-dash-data volume; a deploy never touches them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: life-dash:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -e SECRET_KEY=smoke-test-secret-0123456789 -p 127.0.0.1:8080:8080 life-dash:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>Life Dash</title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/me)" = 401
          docker logs smoke
          docker rm -f smoke

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'life-dash' }}
      IMAGE_REF: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          for v in VPS_HOST VPS_USER VPS_SSH_KEY GHCR_PAT; do
            [ -n "${!v}" ] || { echo "::error::$v is not set in the prod environment"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set, so the server's host key is trusted without verification. Add it to the prod environment (ssh-keyscan -p $VPS_PORT $VPS_HOST)."
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
            [ -s ~/.ssh/known_hosts ] || { echo "::error::Couldn't reach $VPS_HOST:$VPS_PORT"; exit 1; }
          fi
          chmod 644 ~/.ssh/known_hosts
          {
            echo "Host target"
            echo "  HostName $VPS_HOST"
            echo "  User $VPS_USER"
            echo "  Port $VPS_PORT"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
          } > ~/.ssh/config

      - name: Upload compose file
        run: |
          ssh target "mkdir -p '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/life-dash.env'" \
            || { echo "::error::$DEPLOY_PATH/life-dash.env is missing on the server. Create it from .env.example first."; exit 1; }
          scp deploy/compose.yml "target:$DEPLOY_PATH/compose.yml"

      - name: Pull and start
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          # The token is piped over SSH (never on a command line) and the server logs out again after pulling.
          printf '%s' "$GHCR_PAT" | ssh target "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null"
          ssh target "cd '$DEPLOY_PATH' && export LIFE_DASH_IMAGE='$IMAGE_REF' \
            && (docker compose pull; s=\$?; docker logout ghcr.io >/dev/null; exit \$s) \
            && docker compose up -d --remove-orphans \
            && docker image prune -f >/dev/null"
          echo "Deployed $IMAGE_REF"

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            state=$(ssh target "cd '$DEPLOY_PATH' && docker inspect --format '{{.State.Health.Status}}' \$(LIFE_DASH_IMAGE='$IMAGE_REF' docker compose ps -q life-dash)")
            echo "health: $state"
            [ "$state" = healthy ] && exit 0
            [ "$state" = unhealthy ] && break
            sleep 3
          done
          ssh target "cd '$DEPLOY_PATH' && LIFE_DASH_IMAGE='$IMAGE_REF' docker compose logs --tail 50 life-dash"
          exit 1
